name: Monitoring Alerts

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
  workflow_dispatch:
    inputs:
      alert_message:
        description: Message used to validate the Discord integration
        required: false
        default: Test alert from the Ritmo CI/CD pipeline

permissions:
  contents: read

concurrency:
  group: alerts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify-discord:
    name: Send Discord alert
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate alert configuration
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Configure the DISCORD_WEBHOOK_URL repository secret before running alerts."
            exit 1
          fi

      - name: Send alert to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MESSAGE: ${{ inputs.alert_message }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ALERT_TEXT="🧪 ${MANUAL_MESSAGE}"
          else
            ALERT_TEXT="🚨 Workflow ${FAILED_WORKFLOW} terminou com status ${FAILED_CONCLUSION}. ${FAILED_RUN_URL}"
          fi

          export ALERT_TEXT
          PAYLOAD="$(node -e 'process.stdout.write(JSON.stringify({ username: "Ritmo CI/CD", content: process.env.ALERT_TEXT }))')"

          curl --fail-with-body --retry 3 \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
